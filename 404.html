<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DROP! – Page not found</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1d6fd1">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
  <link rel="stylesheet" href="/legal.css">
  <style>
    /* GitHub Pages zeigt diese Seite bei unbekannten Adressen; Pfade deshalb absolut */
    .notfound { text-align: center; }
    .notfound img { width: 160px; height: auto; margin: 16px auto 0; display: block; }
    .notfound .btn {
      display: inline-block;
      margin: 18px 0 8px;
      padding: 12px 26px;
      border-radius: 999px;
      background: #2bb24c;
      box-shadow: 0 5px 0 #1d7f35;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <section class="card notfound">
      <img src="/img/logo.webp" width="432" height="432" alt="DROP! logo">
      <h1>Missed the landing zone!</h1>
      <p>This page doesn’t exist (anymore).</p>
      <a class="btn" href="/">Back to DROP!</a>
    </section>
  </main>
</body>
</html>
